; tdc_debug_jlink 설정 (PC 마다 고친다). tdc_debug_jlink/tdc_config.py 가 읽는다.
; 이 파일이 없거나 값이 비면 tdc_config.py 의 기본값을 쓴다. 상대 경로는 이 파일이 있는 폴더 기준.

[jlink]
serial   =              ; 비우면 꽂힌 J-Link 가 하나일 때 그것을 쓴다
dll_path =                                                    ; 비우면 pylink 기본 검색 (PATH, C:\Program Files*\SEGGER\JLink*)

[target]
chip      = Cortex-M3
interface = SWD
speed_khz = 12000       ; 추천 12000, 상한 15000. 통신 오류가 나면 낮춘다

[debug_block]
header_addr = 0x21010000   ; 펌웨어 TDC_DEBUG_JLINK_BASE (CFX P:0x64000) 의 CM3 주소

[rtt]
cb_address   = 0x20000000
up_channel   = 0
down_channel = 0
poll_ms      = 10       ; RTT 읽기 주기

[loop]
poll_ms      = 1        ; main 루프 쉼 (DCRDR 확인 주기)
watch_ms     = 100      ; 연결 감시, header magic 확인 주기
reconnect_s  = 1.0      ; 끊겼을 때 다시 연결하는 간격
log_s        = 1        ; 종합 로그 간격 (초). 명령 log N 으로 바꾼다
read_max     = 256      ; read 명령 최대 워드 수

[inject]
data_dir = data          ; DMIC 창에서 주입 WAV 를 고를 때 처음 여는 폴더

[save]
out_dir = logs          ; save on 일 때 DMIC WAV, vMag CSV 를 쓰는 폴더
